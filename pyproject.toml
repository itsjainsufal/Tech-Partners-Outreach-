[project]
name = "tech-partners-outreach"
version = "0.1.0"
description = "Draft personalized tech partner outreach emails into a human-review queue."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
tech-partners-outreach = "tech_partners_outreach.__main__:main"
tech-partners-outreach-mcp = "tech_partners_outreach.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tech_partners_outreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
